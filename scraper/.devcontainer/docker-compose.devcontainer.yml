services:
  postgres:
    image: postgres:18.1-alpine
    container_name: ares_codex_scraper_dev_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ares_db}
      POSTGRES_USER: ${POSTGRES_USER:-ares_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ares_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ares_user} -d ${POSTGRES_DB:-ares_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  scraper:
    build:
      context: ..
      target: development
    container_name: ares_codex_scraper_dev
    volumes:
      - ..:/app
    env_file:
      - ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ares_db}
      DB_USER: ${POSTGRES_USER:-ares_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ares_pass}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
