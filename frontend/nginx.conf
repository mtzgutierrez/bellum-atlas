server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las rutas de React Router son del lado cliente: cualquier ruta que no
    # corresponda a un fichero real cae en index.html (SPA fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para los assets con hash de Vite (su nombre cambia al
    # cambiar el contenido, así que es seguro cachearlos "para siempre").
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
