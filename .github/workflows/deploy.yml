name: Deploy

# Despliegue continuo a Hetzner.
#
# Se dispara cuando el workflow "CI" (.github/workflows/ci.yml) TERMINA en la
# rama main. El job solo sigue adelante si ese CI acabó en `success`, de modo
# que NUNCA se despliega código que no haya pasado tests + build gate.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   SSH_HOST         IP pública del servidor Hetzner.
#   SSH_USER         usuario de deploy (p. ej. `deploy`).
#   SSH_PRIVATE_KEY  clave privada de un par DEDICADO al deploy (su .pub va en
#                    ~/.ssh/authorized_keys del usuario de deploy en el servidor).
#   SSH_PORT         (opcional) puerto SSH; por defecto 22.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Un único despliegue a la vez; no cancelamos uno en curso (podría dejar el
# servidor a medias), los encolamos.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read # para que el server haga `docker pull` de GHCR con GITHUB_TOKEN

jobs:
  deploy:
    environment: production
    name: Deploy · Hetzner
    runs-on: ubuntu-latest
    # Solo si el CI fue en main y terminó correctamente.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          # Forwardeamos credenciales de GHCR y el tag a desplegar al script
          # remoto. GITHUB_TOKEN basta para `docker pull` (permiso packages:read).
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: REGISTRY_USER,REGISTRY_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            cd ~/bellum-atlas

            # Trae main exactamente como está en el remoto (descarta cualquier
            # cambio local del servidor; el .env de prod está gitignored y no se
            # toca).
            git fetch --all --prune
            git reset --hard origin/main

            # Autenticación en GHCR para poder descargar las imágenes privadas.
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            # Descarga las imágenes ya construidas en CI (NO se compila aquí) y
            # levanta el stack. IMAGE_TAG fija el SHA exacto desplegado.
            export IMAGE_TAG
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Aplica migraciones pendientes (no resetea datos).
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T backend npx prisma migrate deploy

            # Cierra sesión y libera espacio de imágenes viejas.
            docker logout ghcr.io
            docker image prune -f
