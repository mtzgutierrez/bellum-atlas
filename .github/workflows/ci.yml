name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: read # gitleaks-action lista los commits del PR vía API en eventos pull_request

# Cancela ejecuciones en vuelo de la misma PR o rama cuando llega un commit nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Tests unitarios (totalmente mockeados — sin BD real).
  # ───────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend · Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # DATABASE_URL debe existir aunque no se conecte: prisma.config.ts lo lee y el
    # constructor de PrismaService crea un pg.Pool (lazy, nunca conecta en unit).
    env:
      DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --ci

  # ───────────────────────────────────────────────────────────────────────────
  # Tests de integración contra una PostgreSQL REAL (service container = el
  # equivalente en CI a docker-compose.test.yml).
  # ───────────────────────────────────────────────────────────────────────────
  e2e-backend:
    name: Backend · E2E (Postgres real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: bellum_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d bellum_test"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/bellum_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy # esquema + triggers reales
      - run: npm run test:e2e -- --ci

  # ───────────────────────────────────────────────────────────────────────────
  # Gate de BUILD previo a deploy: garantiza que TODO compila sin errores
  # (typecheck real, no solo swc) y que el artefacto de despliegue (imagen de
  # producción) arranca y responde /health. Cubre el bug D-1 (entrypoint).
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build · Deploy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend: typecheck real (nest build usa swc con typeCheck:false) + build.
      - name: Backend · install
        working-directory: backend
        run: npm ci
      - name: Backend · prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Backend · typecheck
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Backend · build
        working-directory: backend
        run: npm run build

      # Frontend: `npm run build` ya hace `tsc -b && vite build`.
      - name: Frontend · install
        working-directory: frontend
        run: npm ci
      - name: Frontend · build
        working-directory: frontend
        run: npm run build

      # Smoke del artefacto de deploy: levanta las imágenes de PRODUCCIÓN con
      # compose y comprueba que el backend arranca y responde /health. Si el
      # entrypoint es incorrecto o el contenedor crashea, esto falla.
      - name: Prod images · smoke /health
        run: |
          cat > .env <<'EOF'
          NODE_ENV=production
          BUILD_TARGET=production
          COMPOSE_PROJECT_NAME=bellum_ci
          POSTGRES_DB=bellum
          POSTGRES_USER=bellum
          POSTGRES_PASSWORD=bellum
          POSTGRES_PORT=5432
          POSTGRES_HOST=postgres
          REDIS_HOST=redis
          REDIS_PORT=6379
          AI_PROVIDER=mock
          VITE_API_URL=http://localhost:3000
          FRONTEND_PORT=5173
          EOF
          docker compose up -d --build postgres redis backend
          echo "Esperando a /health…"
          for i in $(seq 1 40); do
            if docker compose exec -T backend wget -qO- http://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "✓ backend healthy"; ok=1; break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "✗ el backend de producción no respondió /health"; docker compose logs backend; exit 1
          fi
      - name: Teardown
        if: always()
        run: docker compose down -v

  # ───────────────────────────────────────────────────────────────────────────
  # Seguridad estática y determinista (gate de PR).
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Security · scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks necesita el histórico

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Dependencias: falla en alto/crítico (moderate solo informa por ahora).
      - name: Audit · backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit · frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      # Secret scanning.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Vulnerabilidades de deps + IaC/Dockerfile. El code scanning (SARIF en la
      # pestaña Security) requiere GitHub Advanced Security, no disponible en repos
      # privados de cuenta individual, así que Trivy actúa como gate por exit-code:
      # falla el job si encuentra HIGH/CRITICAL.
      - name: Trivy · filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ───────────────────────────────────────────────────────────────────────────
  # Publica las imágenes de PRODUCCIÓN en GHCR. Se construyen aquí (runner de
  # GitHub, con RAM de sobra) en vez de en el servidor Hetzner, que se quedaba
  # sin memoria al hacer `up --build`. El deploy luego solo hace `pull`.
  #
  # Solo en push a main y solo si tests + build gate pasaron. Etiqueta cada
  # imagen con `latest` y con el SHA del commit (para desplegar exactamente lo
  # construido y poder hacer rollback).
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish · GHCR
    runs-on: ubuntu-latest
    needs: [test-backend, e2e-backend, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend · build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend · build & push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
